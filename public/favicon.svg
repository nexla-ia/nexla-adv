<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- Fundo gradiente azul-roxo -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Chat bubble -->
  <rect x="10" y="8" width="74" height="60" rx="12" stroke="white" stroke-width="4.5" fill="none" opacity="0.92"/>
  <!-- Ponteiro da bubble -->
  <path d="M16 68 L10 84 L32 68" fill="white" opacity="0.92"/>
  <!-- Balança: haste central -->
  <line x1="50" y1="18" x2="50" y2="54" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Balança: barra horizontal -->
  <line x1="27" y1="29" x2="73" y2="29" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Prato esquerdo: corrente -->
  <line x1="27" y1="29" x2="27" y2="44" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Prato esquerdo: arco -->
  <path d="M19 44 Q27 53 35 44" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Prato direito: corrente (levemente mais baixo) -->
  <line x1="73" y1="29" x2="73" y2="42" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Prato direito: arco -->
  <path d="M65 42 Q73 51 81 42" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Balança: base -->
  <line x1="43" y1="54" x2="57" y2="54" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
</svg>
